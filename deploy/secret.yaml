# TEMPLATE ONLY — do not commit real credentials.
#
# Preferred approach (no YAML with secrets):
#
#   oc create secret generic ocp-mcp-server-credentials \
#     --from-literal=OCP_API_URL=https://api.cluster.example.com:6443 \
#     --from-literal=OCP_TOKEN=sha256~xxxxxxxx \
#     --from-literal=ANTHROPIC_API_KEY=sk-ant-xxxxxxxx \
#     -n ocp-mcp
#
# Multi-cluster variant:
#   oc create secret generic ocp-mcp-server-credentials \
#     --from-literal=OCP_CLUSTERS='[{"name":"prod","api_url":"https://api.prod.example.com:6443","token":"sha256~prod..."},{"name":"staging","api_url":"https://api.staging.example.com:6443","token":"sha256~staging..."}]' \
#     --from-literal=ANTHROPIC_API_KEY=sk-ant-xxxxxxxx \
#     -n ocp-mcp
#
# In-cluster deployment (server manages the same cluster it runs in):
#   No OCP_API_URL / OCP_TOKEN needed — the SA token is mounted automatically.
#   Only ANTHROPIC_API_KEY is required (for the Gradio AI Chat tab).
#
#   oc create secret generic ocp-mcp-server-credentials \
#     --from-literal=ANTHROPIC_API_KEY=sk-ant-xxxxxxxx \
#     -n ocp-mcp
apiVersion: v1
kind: Secret
metadata:
  name: ocp-mcp-server-credentials
  namespace: ocp-mcp
  labels:
    app.kubernetes.io/name: ocp-mcp-server
type: Opaque
stringData:
  # ── Single-cluster token auth ─────────────────────────────────────────────
  # Leave empty when using in-cluster SA token (server runs inside the cluster)
  # or when OCP_CLUSTERS is set.
  OCP_API_URL: ""
  OCP_TOKEN: ""

  # ── Single-cluster username/password auth ─────────────────────────────────
  # OCP_USERNAME: ""
  # OCP_PASSWORD: ""

  # ── Multi-cluster JSON array (takes priority over OCP_API_URL+OCP_TOKEN) ──
  # Uncomment and fill in to manage multiple clusters simultaneously.
  # OCP_CLUSTERS: |
  #   [
  #     {"name":"prod",    "api_url":"https://api.prod.example.com:6443",    "token":"sha256~prod..."},
  #     {"name":"staging", "api_url":"https://api.staging.example.com:6443", "token":"sha256~staging...", "skip_tls_verify": true}
  #   ]

  # ── Prometheus auth (defaults to OCP_TOKEN when unset) ───────────────────
  # OCP_PROMETHEUS_TOKEN: ""

  # ── Anthropic API key (required only for Gradio AI Chat tab) ─────────────
  ANTHROPIC_API_KEY: ""
