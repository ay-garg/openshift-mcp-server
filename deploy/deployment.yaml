apiVersion: apps/v1
kind: Deployment
metadata:
  name: ocp-mcp-server
  namespace: ocp-mcp
  labels:
    app.kubernetes.io/name: ocp-mcp-server
    app.kubernetes.io/component: server
spec:
  # MCP servers are stateless; scale to >1 only when multiple independent LLM
  # clients need dedicated connections. Most deployments run 1 replica.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ocp-mcp-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ocp-mcp-server
        app.kubernetes.io/component: server
    spec:
      serviceAccountName: ocp-mcp-server

      # ── Pod-level security ────────────────────────────────────────────────
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: ocp-mcp-server
          # Replace with your registry image after pushing:
          #   podman build -f Containerfile -t quay.io/your-org/ocp-mcp-server:latest .
          #   podman push quay.io/your-org/ocp-mcp-server:latest
          image: quay.io/rhn_support_aygarg/openshift-mcp-server:latest 
          imagePullPolicy: Always

          ports:
            - name: mcp-sse
              containerPort: 8080
              protocol: TCP

          # ── Non-secret config from ConfigMap ────────────────────────────
          envFrom:
            - configMapRef:
                name: ocp-mcp-server

          # ── Sensitive credentials from Secret ───────────────────────────
          # All keys are optional=true so that in-cluster auth (no secret values
          # needed) works without changes to the Secret.
          env:
            - name: OCP_API_URL
              valueFrom:
                secretKeyRef:
                  name: ocp-mcp-server-credentials
                  key: OCP_API_URL
                  optional: true
            - name: OCP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ocp-mcp-server-credentials
                  key: OCP_TOKEN
                  optional: true
            - name: OCP_CLUSTERS
              valueFrom:
                secretKeyRef:
                  name: ocp-mcp-server-credentials
                  key: OCP_CLUSTERS
                  optional: true
            - name: OCP_PROMETHEUS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ocp-mcp-server-credentials
                  key: OCP_PROMETHEUS_TOKEN
                  optional: true
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ocp-mcp-server-credentials
                  key: ANTHROPIC_API_KEY
                  optional: true

          # ── Resource requests / limits ──────────────────────────────────
          # The server is I/O-bound (API calls + subprocess). CPU limit of 1
          # covers simultaneous tool calls during an agentic loop; memory 512Mi
          # holds the mcp + kubernetes SDK objects for ~20 concurrent tool calls.
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi

          # ── Container-level security ────────────────────────────────────
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true

          # ── Volume mounts (required for readOnlyRootFilesystem) ─────────
          volumeMounts:
            # oc CLI writes temp files here; subprocess also uses /tmp
            - name: tmp
              mountPath: /tmp
            # oc login writes ~/.kube/config; kubernetes client pip cache
            - name: home
              mountPath: /home/ocp-mcp

          # ── Health probes ───────────────────────────────────────────────
          # SSE endpoint is long-lived; tcpSocket proves the port is accepting
          # connections without consuming an SSE slot.
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          startupProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12         # 60 s startup window

      volumes:
        - name: tmp
          emptyDir: {}
        - name: home
          emptyDir: {}
